<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Gestão de Férias{% endblock %}</title>
    <style>
      :root {
        --bg-main: #f5f7fb;
        --card-bg: #ffffff;
        --primary: #1b6a5a;
        --primary-dark: #155245;
        --text-main: #222222;
        --text-muted: #666666;
        --border: #dde2ee;
        --danger: #c0392b;
        --success: #1f8a4c;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; padding: 0; }

      body {
        font-family: "DIN", "DINPro", Arial, Helvetica, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
      }

      a { color: inherit; }

      /* ======= primitives ======= */
      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      }

      .muted { color: var(--text-muted); font-size: 13px; line-height: 1.4; }

      .text-danger { color: var(--danger); font-size: 13px; }
      .text-success { color: var(--success); font-size: 13px; }

      .btn {
        border-radius: 20px;
        padding: 8px 18px;
        border: 1px solid transparent;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s ease;
        background: var(--primary);
        color: #fff;
      }

      .btn:hover { background: var(--primary-dark); }

      .btn-secondary {
        background: transparent;
        border-color: var(--border);
        color: var(--text-main);
      }
      .btn-secondary:hover { background: rgba(0,0,0,0.03); }

      .btn-link {
        background: transparent;
        border: none;
        color: var(--primary);
        padding: 0;
      }

      .input, input[type="text"], input[type="email"], input[type="password"], input[type="date"], input[type="number"], select, textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 14px;
        outline: none;
        background: #fff;
      }

      .input:focus, input:focus, select:focus, textarea:focus {
        border-color: rgba(27,106,90,0.55);
        box-shadow: 0 0 0 3px rgba(27,106,90,0.12);
      }

      .divider { height: 1px; background: var(--border); margin: 14px 0; }

      /* ======= auth (login) ======= */
      .auth-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .auth-card { width: 100%; max-width: 520px; }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: linear-gradient(135deg, #1b6a5a, #f1c40f, #c0392b);
      }
      .brand-name { font-weight: 700; }

      /* ======= dashboard layout ======= */
      .dash {
        min-height: 100vh;
        display: flex;
      }

      .sidebar {
        width: 260px;
        background: #fff;
        border-right: 1px solid var(--border);
        padding: 16px;
        position: sticky;
        top: 0;
        height: 100vh;
      }

      .sidebar .brand {
        margin-bottom: 10px;
      }

      .userbox {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px;
        margin: 12px 0 16px;
        display: flex;
        gap: 10px;
        align-items: center;
        background: rgba(0,0,0,0.01);
      }
      .userbox .avatar {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: rgba(27,106,90,0.12);
        display: grid;
        place-items: center;
        font-weight: 700;
        color: var(--primary);
      }
      .userbox .name { font-weight: 700; font-size: 12px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .userbox .role { font-size: 12px; color: var(--text-muted); }

      .nav {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .nav a {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 12px;
        border-radius: 12px;
        text-decoration: none;
        color: var(--text-main);
        border: 1px solid transparent;
      }

      .nav a:hover { background: rgba(0,0,0,0.03); }
      .nav a.active {
        background: rgba(27,106,90,0.10);
        border-color: rgba(27,106,90,0.18);
        color: var(--primary);
        font-weight: 700;
      }

      .main {
        flex: 1;
        padding: 18px 22px 28px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        margin-bottom: 16px;
      }

      .topbar .title {
        font-size: 18px;
        font-weight: 800;
        margin: 0;
      }

      .content-wrap { width: 100%; max-width: 100%; }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        align-items: start;
      }

      @media (max-width: 980px) {
        .dash { flex-direction: column; }
        .sidebar { width: 100%; height: auto; position: relative; }
        .main { padding: 14px 14px 24px; }
        .content-wrap { max-width: 100%; }
        .grid-2 { grid-template-columns: 1fr; }
      }

      /* ======= admin helpers ======= */
      .search-row { display: flex; gap: 10px; }
      .search-row .input { flex: 1; }

      .result-list { display: flex; flex-direction: column; gap: 8px; }
      .result-item {
        width: 100%;
        text-align: left;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px;
        background: #fff;
        cursor: pointer;
      }
      .result-item:hover { background: rgba(0,0,0,0.02); }

      .result-title { font-weight: 700; font-size: 14px; }
      .result-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

      .empty {
        padding: 14px;
        border: 1px dashed var(--border);
        border-radius: 14px;
        color: var(--text-muted);
        text-align: center;
        font-size: 13px;
      }

      .checkboxes { display: flex; gap: 14px; flex-wrap: wrap; }
      .chk { display: flex; align-items: center; gap: 8px; font-size: 14px; }
      .chk input { width: 16px; height: 16px; }

      .actions { display: flex; gap: 10px; flex-wrap: wrap; }

    </style>
    {% block head_extra %}{% endblock %}
  </head>

  <body>
    {% block app_shell %}
      <div class="auth-shell">
        <div class="card auth-card">
          <div class="brand">
            <div class="brand-mark"></div>
            <div class="brand-name">Gestão de Férias</div>
          </div>
          {% block content %}{% endblock %}
        </div>
      </div>
    {% endblock %}
  </body>
</html>

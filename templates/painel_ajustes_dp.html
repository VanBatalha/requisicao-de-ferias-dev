{% extends "dashboard_layout.html" %}

{% block content %}
<div class="topbar">
  <h1 class="title">Ajustes de Ferias</h1>
</div>

<div class="content-wrap">
  <div class="grid-2">
    <!-- ESQUERDA: Lista de Gestores -->
    <div class="card">
      <h3>Gestores</h3>
      <div class="search-row">
        <input type="text" class="input" id="search-gestores" placeholder="Procurar gestor...">
      </div>
      <div class="result-list" id="gestores-list">
        <!-- Preenchido via JavaScript -->
      </div>
    </div>

    <!-- DIREITA: Subordinados do Gestor -->
    <div class="card">
      <h3>Subordinados</h3>
      <div id="subordinados-container" style="display:none;">
        <div class="result-list" id="subordinados-list">
          <!-- Preenchido via JavaScript -->
        </div>
      </div>
      <div id="no-gestor-selected" class="empty">
        Selecione um gestor para ver seus subordinados
      </div>
    </div>
  </div>

  <!-- FORMULARIO DE AJUSTE -->
  <div class="card" id="form-ajuste" style="display:none; margin-top:20px;">
    <h3>Ajustar Dias para <span id="colab-selecionado"></span></h3>
    
    <div style="margin-bottom:15px;">
      <label>Dias de Ferias:</label>
      <input type="number" id="dias-ferias" class="input" min="0" placeholder="Quantidade de dias">
      <p class="muted">Dias calculados automaticamente: <span id="dias-calculados">0</span></p>
    </div>

    <div style="margin-bottom:15px;">
      <label>Dias de Licenca Premium:</label>
      <input type="number" id="dias-premium" class="input" min="0" placeholder="Quantidade de dias">
      <p class="muted">Dias de premium calculados: <span id="dias-premium-calculados">0</span></p>
    </div>

    <div class="actions">
      <button class="btn" id="btn-salvar-ajuste">Salvar Ajuste</button>
      <button class="btn btn-secondary" id="btn-cancelar-ajuste">Cancelar</button>
    </div>
  </div>
</div>

<script>
// Script para carregar gestores e subordinados
// Implementar chamadas AJAX para /api/rh/gestores/relacao
// e /api/rh/colaboradores
</script>
{% endblock %}
